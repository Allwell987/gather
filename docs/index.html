<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Privacy Policy — Gather</title>
  <link rel="stylesheet" href="/styles/privacy.css">
  <style>
    body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,'Helvetica Neue',Arial;margin:0;padding:24px;background:#f7fafc;color:#0f172a}
    .container{max-width:900px;margin:0 auto;background:#fff;padding:28px;border-radius:8px;box-shadow:0 6px 18px rgba(15,23,42,0.06)}
    h1,h2,h3{color:#0f172a}
    pre,code{background:#0f172a10;padding:6px;border-radius:4px}
    a{color:#0366d6}
  </style>
</head>
<body>
  <div class="container">
    <div id="content">Loading privacy policy…</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    async function render() {
      try {
        const res = await fetch('/PRIVACY.md');
        if (!res.ok) throw new Error('Failed to load PRIVACY.md');
        const md = await res.text();
        document.getElementById('content').innerHTML = marked.parse(md);
      } catch (err) {
        document.getElementById('content').textContent = 'Could not load privacy policy.';
        console.error(err);
      }
    }
    render();
  </script>
</body>
</html>

pluginManagement {
    def projectRoot = file("../")
    def reactNativeGradlePluginPath = new File(
        providers.exec {
            workingDir(projectRoot)
            commandLine("node", "--print", "require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json')] })")
        }.standardOutput.asText.get().trim()
    ).getParentFile().absolutePath

    includeBuild(reactNativeGradlePluginPath)

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id("com.facebook.react.settings")
}

def repo = file("../")
def expoPackageJson = new File(
    providers.exec {
        workingDir(repo)
        commandLine("node", "--print", "require.resolve('expo/package.json')")
    }.standardOutput.asText.get().trim()
)

apply from: new File(expoPackageJson.getParentFile(), "scripts/autolinking.gradle")
useExpoModules()

rootProject.name = 'Gather'

include ':app'

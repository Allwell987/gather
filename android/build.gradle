// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = findProperty('android.buildToolsVersion') ?: "34.0.0"
        minSdkVersion = findProperty('android.minSdkVersion')?.toInteger() ?: 23
        compileSdkVersion = findProperty('android.compileSdkVersion')?.toInteger() ?: 34
        targetSdkVersion = findProperty('android.targetSdkVersion')?.toInteger() ?: 34
        kotlinVersion = findProperty('android.kotlinVersion') ?: "1.9.23"

        ndkVersion = findProperty('android.ndkVersion') ?: "26.1.10909125"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.2.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
        classpath("com.google.gms:google-services:4.4.1")
        classpath("com.facebook.react:react-native-gradle-plugin")
    }
}

plugins {
    id("com.facebook.react.rootproject")
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://www.jitpack.io' }
    }
}

apply plugin: "expo-root-project"
